# Push a tag like v0.2.0 → signed, notarized Files.dmg (and an AppImage) on
# the GitHub release. Everything comes from Bundle.toml; CI only supplies the
# secrets:
#   MACOS_CERTIFICATE           base64 of your "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  its export password
#   MACOS_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   (app-specific password)
#   WINDOWS_CERTIFICATE           base64 of a code-signing .pfx (optional)
#   WINDOWS_CERTIFICATE_PASSWORD  its password
name: Release

on:
  push:
    tags: ["v*"]

# Signs every installer with the update key (not the license key), so the
# app can download and verify updates itself.
env:
  FILES_UPDATE_KEY: ${{ secrets.FILES_UPDATE_KEY }}

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      FILES_REQUIRE_VLC: "1"
      # Without a Developer ID certificate the app is signed ad hoc: it runs
      # after "Open Anyway" (see the downloads page).
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install VLC (its libvlc ships inside Files.app for video previews)
        run: brew install --cask vlc
      - name: Import the signing certificate into a temporary keychain
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Store the notarization profile
        if: env.HAS_CERTIFICATE == 'true'
        run: xcrun notarytool store-credentials files-notary --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}"
      - name: Bundle, sign, notarize
        if: env.HAS_CERTIFICATE == 'true'
        env:
          FILES_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: cargo xtask bundle --notarize
      - name: Bundle (signed ad hoc)
        if: env.HAS_CERTIFICATE != 'true'
        run: cargo xtask bundle
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dist/*.dmg
            target/dist/*.dmg.sig

  linux:
    env:
      FILES_REQUIRE_VLC: "1"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies and appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libssl-dev libfuse2 libasound2-dev
          # libVLC and its plugins go into the AppImage for video previews.
          sudo apt-get install -y libvlc5 libvlccore9 vlc-plugin-base vlc-plugin-video-output
          # Downloads from GitHub sometimes fail halfway: retry, and check
          # what arrived is an executable, not an error page.
          # A mirror when the main release's file is unavailable (GitHub served
          # 504s for it in November 2026).
          fetch() { sudo curl -fL --retry 4 --retry-all-errors --retry-delay 5 -o "$1" "$2"; }
          fetch /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            || fetch /usr/local/bin/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            || fetch /usr/local/bin/appimagetool https://github.com/FileForce/files/releases/download/build-tools/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          # Runs without FUSE (the older tool from the mirror needs this).
          export APPIMAGE_EXTRACT_AND_RUN=1
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          appimagetool --version
          # The runtime appimagetool would fetch itself during the build.
          sudo mkdir -p /opt/appimage
          fetch /opt/appimage/runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 \
            || fetch /opt/appimage/runtime-x86_64 https://github.com/FileForce/files/releases/download/build-tools/runtime-x86_64
          echo "APPIMAGE_RUNTIME=/opt/appimage/runtime-x86_64" >> "$GITHUB_ENV"
      - run: cargo xtask bundle
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section "## <version>", up to the next "## ".
          awk -v version="$version" '
            $0 == "## " version { keep = 1; next }
            keep && /^## / { exit }
            keep { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "**Installing:** the builds are not signed by Apple or Microsoft yet."
            echo "macOS: open it once, then System Settings → Privacy & Security → Open Anyway."
            echo "Windows: SmartScreen → More info → Run anyway."
            echo "Linux: \`chmod +x\` the AppImage."
          } >> release-notes.md
          if [ ! -s release-notes.md ] || ! grep -q '[^[:space:]]' <(head -n -6 release-notes.md); then
            echo "::warning::CHANGELOG.md has no section for $version"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: Files ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            target/dist/*.AppImage
            target/dist/*.AppImage.sig

  windows:
    runs-on: windows-latest
    env:
      FILES_REQUIRE_VLC: "1"
      # `secrets` cannot be read in a step's `if`; this flag can.
      HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install WiX
        # v5: open source (MS-RL). v7 needs the paid OSMF EULA accepted.
        run: dotnet tool install --global wix --version 5.0.2
      - name: Install VLC (its libvlc ships inside the MSI for video previews)
        run: choco install vlc -y --no-progress
      - name: Decode the signing certificate (if one is set)
        if: env.HAS_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}"))
          "FILES_WINDOWS_PFX=$path" >> $env:GITHUB_ENV
      - name: Add signtool to PATH
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if ($signtool) { $signtool.DirectoryName >> $env:GITHUB_PATH }
      - name: Bundle the MSI
        env:
          FILES_WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: cargo xtask bundle
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dist/*.msi
            target/dist/*.msi.sig

  # latest.json, which Files reads at releases/latest/download/latest.json:
  # the version, its notes and each platform's installer with its signature.
  update-manifest:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Write latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mkdir sigs
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir sigs
          notes=$(awk -v version="$version" '
            $0 == "## " version { keep = 1; next }
            keep && /^## / { exit }
            keep { print }
          ' CHANGELOG.md)
          entry() {
            sig=$(ls sigs | grep -E "$1" | head -n1)
            [ -z "$sig" ] && { echo null; return; }
            jq -n --arg url "$base/${sig%.sig}" --arg signature "$(cat "sigs/$sig")" '{url: $url, signature: $signature}'
          }
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg page "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --arg published "$(date +%s)" \
            --argjson macos "$(entry '\.dmg\.sig$')" \
            --argjson windows "$(entry '\.msi\.sig$')" \
            --argjson linux "$(entry '\.AppImage\.sig$')" \
            '{version: $version, notes: $notes, page: $page, published: $published, macos: $macos, windows: $windows, linux: $linux}' > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
