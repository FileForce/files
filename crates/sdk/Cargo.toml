[package]
name = "files-sdk"
version = "0.1.0"
edition = "2024"
description = "Extension SDK for the Files explorer: manifests, capabilities and the host API."
license = "FSL-1.1-MIT"

[dependencies]
# Ed25519 signatures for licenses and extension packages.
ring = "0.17"
base64 = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
