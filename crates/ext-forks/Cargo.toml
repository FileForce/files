[package]
name = "files-ext-forks"
version = "0.3.0"
edition = "2024"
license = "FSL-1.1-MIT"

[dependencies]
files-sdk = { path = "../sdk" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8.23"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Registry"] }
