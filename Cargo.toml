[workspace]
members = ["crates/*"]

[package]
name = "file-force"
version = "0.1.29"
edition = "2024"
description = "Files: a fast file explorer for macOS and Linux with Git, SSH, AI agents and extensions."
license = "FSL-1.1-MIT"
repository = "https://github.com/FileForce/files"
homepage = "https://github.com/FileForce/files"

[dependencies]
notify-rust = "4"
files-sdk = { path = "crates/sdk" }
files-ext-archive = { path = "crates/ext-archive" }
files-ext-ssh = { path = "crates/ext-ssh" }
files-ext-forks = { path = "crates/ext-forks" }
files-ext-agents = { path = "crates/ext-agents" }
files-ext-mail = { path = "crates/ext-mail" }
files-ext-music = { path = "crates/ext-music" }
files-ext-git = { path = "crates/ext-git" }
libloading = "0.8"
libc = "0.2"
gpui-kit = "=0.8.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
url = "2"
# Office documents (.docx, .odt, .pptx) are zip files: their text for the preview.
zip = { version = "9", default-features = false, features = ["deflate"] }
getrandom = "0.3"
nucleo = "=0.5.0"
rust-embed = { version = "8.7", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
trash = "5"
sysinfo = { version = "0.31", default-features = false, features = ["disk", "system"] }
toml = "0.8.23"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
kamadak-exif = "0.6.2"
ureq = { version = "3.5.1", features = ["json"] }
pelite = "0.10.0"
hayro = "0.9.0"
resvg = "0.46"
usvg = "0.46"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-av-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
plist = "1"
xattr = "1"

# Battery charge for automatic power saving.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The app icon inside file-force.exe (resource 1: window, taskbar, Explorer).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Archive fixtures in tests.
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
gpui-pre = { version = "=0.3.10", features = ["test-support"] }

# Smaller binaries that are harder to read and patch: no symbols, whole-crate
# optimization across dependencies.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
